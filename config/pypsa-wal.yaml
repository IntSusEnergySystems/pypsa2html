# PyPSA-Wal -- Walloon regional model (repo: pypsa-wal).
#
#     pypsa2html build --config /path/to/pypsa2html/config/pypsa-wal.yaml
root: /sylvain/git/pypsa-wal

project:
  name: PyPSA-Wal
  subtitle: Walloon energy system scenarios
  decimals: 3

model:
  clusters: adm
  opts: ""
  sector_opts: ""
  planning_horizons: null      # 2025 / 2030 / 2040 / 2050, discovered on disk
  # 10 GWh, not the 100 GWh default. The threshold is not only a decluttering
  # choice: a dropped flow is a flow the Sankey's energy-conservation check
  # (`graph_imbalances`) then reports as a hole. On a region the size of
  # Wallonia the default silently deleted the whole agricultural electricity
  # demand (0.063 TWh) and both district-heat storage legs, and with them
  # 0.3 TWh of the electricity node's balance.
  flow_threshold: 0.01

nodes:
  detect: true
  focus: BEWAL                 # Wallonia is the region of interest
  labels:
    BEWAL: Wallonia
    BEVLG: Flanders
    BEBRU: Brussels
    DE: Germany
    FR: France
    GB: Great Britain
    LU: Luxembourg
    NL: Netherlands
  aggregate:
    enabled: true
    code: ALL
    label: All regions
  # Belgium as a group so self-sufficiency (and every other nodal chart) can
  # be read for the country without summing the three regional pages by hand.
  # Explicit members only — BE never silently includes BEWAL.
  groups:
    - {code: BE, label: Belgium, members: [BEVLG, BEWAL, BEBRU]}

scenarios:
  - name: scen_demande_haute
    label: High demand
    results_dir: results/walloon/scen_demande_haute
    resources_dir: resources/walloon/scen_demande_haute
  - name: scen_corrige
    label: Corrected
    results_dir: results/times-pypsa/scen_corrige
    resources_dir: resources/times-pypsa/scen_corrige
  - name: scen_base
    label: Base
    results_dir: results/times-pypsa/scen_base
    resources_dir: resources/times-pypsa/scen_base

landing:
  scenario: scen_demande_haute   # the most recently solved scenario
  node: BEWAL
  page: overview

output:
  # {scenario} puts each scenario's pages beside that scenario's own csvs/,
  # graphs/ and networks/, so the whole results tree uploads to S3 as one unit.
  dir: results/walloon/{scenario}/html
  pages: [overview, emissions, sankeys, fec, demands, costs, capacities, dispatch, maps]
  shared_maps: true
  plotly: cdn
