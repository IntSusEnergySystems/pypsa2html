# Standalone conda environment for pypsa2html.
#
# If you already work inside a `pypsa-eur` environment you do NOT need this
# file -- that environment is a strict superset. Just install the package into
# it:
#
#     conda activate pypsa-eur
#     pip install -e /path/to/pypsa2html --no-deps
#
# Use this file only to run pypsa2html on its own, e.g. on a machine that has
# the results but not the full PyPSA-Eur toolchain.
#
#     conda env create -f environment.yaml
#     conda activate pypsa2html
#     pip install -e . --no-deps
#
# The version floors are the minimum the library is tested against; see
# pyproject.toml for the authoritative dependency list.

name: pypsa2html
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.14

  # -- core: config, extraction, interactive charts -------------------------
  - pypsa>=0.31
  - pandas>=2.1,<3
  - numpy>=1.24
  - plotly>=5.18
  - jinja2>=3.1
  - pyyaml>=6
  - openpyxl>=3.1
  - netcdf4>=1.6
  - xarray>=2023.8

  # -- optional: the `maps` page -------------------------------------------
  - matplotlib>=3.7
  - geopandas>=0.14
  - cartopy>=0.22

  # -- optional: the weekly-dispatch tab widgets ---------------------------
  - panel>=1.3

  # -- development ---------------------------------------------------------
  - pytest>=7.4
  - pytest-cov>=4.1
  - ruff>=0.4
