[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypsa2html"
version = "0.1.0"
description = "Turn solved PyPSA(-Eur) networks into a navigable HTML report"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Sylvain Quoilin", email = "squoilin@ulg.ac.be" },
]
keywords = ["pypsa", "energy-system", "visualisation", "sankey", "report"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

# Minimum runtime requirements.  These cover the config, taxonomy, extraction
# and interactive-chart layers -- i.e. everything except the map pages.
dependencies = [
    "pypsa>=0.31",
    "pandas>=2.1,<3.0",  # groupby(axis=1) removal in 3.0; see docs/future-work
    "numpy>=1.24",
    "plotly>=5.18",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "openpyxl>=3.1",     # reading/writing the chart-data workbooks
    "netCDF4>=1.6",      # reading solved .nc networks
]

[project.optional-dependencies]
# Needed only for the `maps` page (matplotlib/cartopy choropleths).
maps = [
    "matplotlib>=3.7",
    "geopandas>=0.14",
    "cartopy>=0.22",
]
# Needed only for the weekly-dispatch tab widgets.
dispatch = [
    "panel>=1.3",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
dev = [
    "pypsa2html[maps,dispatch,test]",
    "ruff>=0.4",
]

[project.scripts]
pypsa2html = "pypsa2html.cli:main"

[project.urls]
Homepage = "https://github.com/squoilin/pypsa2html"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypsa2html = ["data/*.csv", "data/*.yaml", "report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: exercises a full HTML generation run (deselect with '-m \"not slow\"')",
    "needs_model: requires solved networks that are not vendored in the repo",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
