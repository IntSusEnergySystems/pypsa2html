# pypsa2html -- packaged defaults.
#
# A project config is deep-merged over this file, so it only needs to state
# what differs.  Every key here is documented in docs/configuration.md.

project:
  name: PyPSA results
  subtitle: ""
  logo: null            # URL or path to a logo overlaid on charts; null = none
  website: null         # "back to project site" link in the nav bar
  decimals: 3

model:
  clusters: adm
  opts: ""
  sector_opts: ""
  network_pattern: "networks/base_s_{clusters}_{opts}_{sector_opts}_{horizon}.nc"
  planning_horizons: null   # null = discover from the files on disk
  base_year: null           # e.g. 2020 to merge an exogenous historical column
  base_year_source: null    # path template for that column, relative to root
  flow_threshold: 0.1       # TWh (Mt for CO2); flows below this are dropped
  # Solved .nc files kept in RAM. null = one per planning horizon (recommended).
  # A small LRU (e.g. 2) with 4 horizons reloads each network dozens of times.
  network_cache_size: null
  dispatch_windows:
    winter: null            # null = derive a week near February from snapshots
    summer: null            # null = derive a week near July from snapshots
  # Display density for weekly dispatch charts (serialisation cost, not accuracy).
  dispatch_step_hours: 2    # 1 = full hourly; 2 ≈ half the plotly JSON
  dispatch_value_decimals: 3

nodes:
  detect: true          # read n.buses.location from the first solved network
  include: null         # explicit list; overrides detection entirely
  exclude: []           # subtracted from the detected list
  labels: {}            # {BEWAL: Wallonia} -- display names for the dropdown
  focus: null           # main region; null = first node. Drives the landing page.
  resolution: location  # 'location' (robust) or 'substring' (the legacy tool)
  aggregate:
    enabled: true
    code: ALL           # NOT "EU": that is a real PyPSA-Eur bus location
    label: ""           # "" = "All N regions"
  # Extra synthetic nodes. Each sums an explicit `members` list — never a
  # prefix match (`BE` must not silently include `BEWAL`). Missing members
  # are skipped with a warning. If `code` is already a detected location,
  # the group is omitted (the real node already has pages). Empty by default.
  # Used by self-sufficiency (and every other nodal chart) for country totals.
  groups: []
  # groups:
  #   - code: BE
  #     label: Belgium
  #     members: [BEVLG, BEWAL, BEBRU]

landing:
  scenario: null        # null = first declared scenario
  node: null            # null = nodes.focus
  page: overview

output:
  # May contain {scenario}. With it, each scenario's pages land beside that
  # scenario's own results (csvs/, graphs/, networks/) and the cross-scenario
  # links become relative paths. Without it, all scenarios share one folder.
  dir: "{scenario}/html"
  # `sensitivity` carries the parameter sweeps and disappears when none are
  # declared. A project that pins this list before adding sweeps gets it
  # appended automatically rather than silently losing the page.
  pages: [overview, sensitivity, emissions, sankeys, fec, demands, costs, capacities, dispatch, maps]
  shared_maps: true     # one maps page for the whole site, not one per node
  plotly: cdn           # 'cdn' (small pages, needs network) or 'inline' (offline)
  chart_data: true      # also write ChartData_<node>.xlsx
  write_index: true     # generate index.html redirecting to the landing page

# Per-section on/off switches, keyed by the section ids in data/pages.yaml.
# Anything not listed keeps the manifest default.
plots: {}

# Narrative HTML injected above a section, keyed by section id then node code.
# `default` applies to any node without a specific entry.
#   texts:
#     sankey_energy:
#       default: "<p>...</p>"
#       BEWAL:   "<p>Wallonia-specific ...</p>"
texts: {}

# Optional feature flags.  null = choose a sensible default from the model.
features:
  # Attribute AC/DC transmission costs/capacities separately from nodal CSVs.
  # null = on when the model has more than one real node.
  transmission_costs: null
  # Filter nodal_capacities for capacity charts using network bus topology
  # (default).  Set to "off" to plot every non-Store row (usually unusable —
  # fuel potentials and vents dominate the GW axis).
  capacity_filter: bus_carrier
  # |€/MWh| above which a bus price is treated as an empty-bus dual (SEPIA B3).
  # Prices are not plotted yet; extract.tables.sanitize_prices is the guard.
  price_abs_cap: 10000.0
  # Primary-energy independence: "uranium" (default) counts the fuel as an
  # import (not mined here, thermal losses included); "electricity" books the
  # kWh the reactors produce as domestic. Electricity independence is unchanged.
  nuclear_primary: uranium

scenarios: []

# Parameter sweeps -- families of runs that differ in a single number.
#
# A sweep is NOT a set of scenarios: six runs at six investment costs answer
# one question, and the answer is a curve. The runs are declared as ordinary
# `scenarios:` entries carrying a marker:
#
#   scenarios:
#     - name: run_nuc_4500
#       results_dir: results/run_nuc_4500
#       sensitivity: {sweep: nuclear_capex, value: 4500}
#
# A scenario with that marker is a sweep *point*: it gets no pages, it is
# absent from the scenario dropdown and from the cross-scenario overview, and
# it feeds the section below instead.
#
# Each entry becomes one section (id `sensitivity_<id>`) on the `sensitivity`
# page, switchable under `plots:` and annotatable under `texts:` like any
# other.
#
#   sensitivities:
#     - id: nuclear_capex            # letters/digits/underscores; the anchor
#       label: Nuclear investment cost
#       parameter: {label: Overnight cost of new nuclear, unit: EUR/kW}
#       nodes: [BEWAL]               # region(s) read; default: nodes.focus
#       description: "<p>Shown above the chart.</p>"
#       metrics:
#         # table: capacity (kind: power|storage|ccs)
#         #        cost     (kind: total|capital|marginal|clustered)
#         #        indicator(field: an Indicators DataFrame, e.g. ghg_sector)
#         # rows:  row labels to sum; omitted = the whole table.  A row the run
#         #        does not carry reads zero.
#         # unit/scale default from the table (MW capacity is plotted in GW).
#         - {table: capacity, kind: power, rows: [nuclear],
#            label: Installed nuclear capacity, unit: GW}
sensitivities: []
