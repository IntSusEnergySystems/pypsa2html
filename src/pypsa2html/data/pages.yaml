# Page manifest -- the single source of truth for what the report contains.
#
# In the legacy tool the same logical chart was named four different ways: a
# prose key in config/plots.yaml ("Cummulative Emissions"), an HTML anchor
# ("#ghg"), an html_texts slug ("CO2_emissions_sector") and a literal in a
# hardcoded `sections` list.  Keeping them in sync was manual and two pairs had
# already drifted apart in the shipped output.  Here each section has exactly
# one `id`, used as the anchor, the plots toggle key and the narrative key.
#
# Fields
#   id       unique across the whole report; becomes the HTML anchor
#   title    display text (TOC entry and <h2>)
#   builder  dotted path, resolved relative to pypsa2html.charts
#   enabled  default on/off; override per project under `plots:` in the config
#   scope    all | real | aggregate  -- which nodes this section applies to
#            (`aggregate` = any synthetic node: study-wide *or* a group)
#   unit     axis/label unit, also written into the chart-data workbook

pages:
  - id: overview
    title: Scenarios overview
    kind: multi_scenario
    sections:
      - {id: cumulative_emissions,   title: Cumulative emissions,            builder: scenario.cumulative_emissions, unit: MtCO2eq}
      - {id: energy_comparison,      title: Energy comparison,               builder: scenario.energy_comparison,    unit: TWh/year}
      - {id: scenario_costs,         title: Annual costs,                    builder: scenario.costs,                unit: EUR/year}
      - {id: scenario_investment,    title: Annual investment costs,         builder: scenario.investment_costs,     unit: EUR/year}
      - {id: scenario_operational,   title: Annual operational costs,        builder: scenario.operational_costs,    unit: EUR/year}
      - {id: scenario_capacities,    title: Capacities,                      builder: scenario.capacities,           unit: GW}
      - {id: scenario_storage,       title: Storage capacities,              builder: scenario.storage_capacities,   unit: GWh}
      - {id: scenario_cc,            title: CCS capacities (fuel input),     builder: scenario.cc_capacities,        unit: GW}
      - {id: energy_independence,    title: Energy independence,             builder: scenario.energy_independence,  unit: '%'}

  # Parameter sweeps. Sections are GENERATED from the project config's
  # `sensitivities:` block -- one per sweep -- so this page carries none of
  # its own. With no sweep declared it has no sections and drops out of the
  # site, which is what a report without sensitivities should look like.
  #
  # A sweep answers one question over a family of runs that differ in a single
  # number, and it reads the same regardless of which region page you arrived
  # from, so the region is pinned in the config and the page is shared.
  - id: sensitivity
    title: Sensitivity analyses
    kind: sensitivity
    shared: true
    sections: []

  - id: emissions
    title: Emissions
    sections:
      - {id: ghg_by_sector,          title: CO2 emissions by sector,             builder: indicators.ghg_by_sector,            unit: MtCO2eq}
      - {id: ghg_by_source,          title: CO2 emissions by source,             builder: indicators.ghg_by_source,            unit: MtCO2eq}
      - {id: ghg_cum_by_sector,      title: Cumulative CO2 emissions by sector,  builder: indicators.ghg_cumulative_by_sector, unit: MtCO2eq}
      - {id: ghg_cum_by_source,      title: Cumulative CO2 emissions by source,  builder: indicators.ghg_cumulative_by_source, unit: MtCO2eq, enabled: false}

  - id: sankeys
    title: Sankey diagrams
    sections:
      - {id: sankey_energy,          title: Sankey diagram,                  builder: sankey.energy, unit: TWh/year}
      - {id: sankey_carbon,          title: Carbon Sankey diagram,           builder: sankey.carbon, unit: MtCO2}

  - id: fec
    title: Energy consumption
    sections:
      - {id: res_share,              title: Renewable energy share,                          builder: indicators.renewable_share,      unit: '%',        enabled: false}
      - {id: fec_by_origin,          title: Final energy consumption by origin,              builder: indicators.fec_by_origin,        unit: TWh/year,   enabled: false}
      - {id: domestic_share,         title: Share of domestic production,                    builder: indicators.domestic_share,       unit: '%',        enabled: false}
      - {id: self_sufficiency,         title: Self-sufficiency,                                builder: indicators.self_sufficiency,         unit: '%'}
      - {id: self_sufficiency_balance, title: Self-sufficiency balance,                        builder: indicators.self_sufficiency_balance, unit: TWh/year}
      - {id: fec_by_sector,          title: Final energy consumption by each sector,         builder: indicators.fec_by_sector,        unit: TWh/year}
      - {id: secondary_mix,          title: Mix of secondary energies,                       builder: indicators.secondary_mix,        unit: TWh/year,   enabled: false}
      - {id: fec_by_carrier,         title: Final energy consumption by carrier per sector,  builder: indicators.fec_by_carrier,       unit: TWh/year}

  - id: demands
    title: Demands
    sections:
      - {id: sectoral_demands,       title: Sectoral demands,                builder: results.sectoral_demands, unit: TWh/year}

  - id: costs
    title: Costs
    sections:
      - {id: annual_costs,           title: Annual costs,                    builder: results.annual_costs,      unit: EUR/year}
      - {id: clustered_costs,        title: Annual costs by group,           builder: results.clustered_costs,   unit: EUR/year}
      - {id: investment_costs,       title: Annual investment costs,         builder: results.investment_costs,  unit: EUR/year}
      - {id: operational_costs,      title: Annual operational costs,        builder: results.operational_costs, unit: EUR/year}

  - id: capacities
    title: Capacities
    sections:
      - {id: power_capacities,          title: Capacities,                         builder: results.capacities,                unit: GW}
      - {id: power_capacities_by_tech,   title: Capacities by technology,           builder: results.capacities_by_tech,         unit: GW}
      - {id: storage_capacities,         title: Storage capacities,                 builder: results.storage_capacities,        unit: GWh}
      - {id: storage_capacities_by_tech, title: Storage capacities by technology,   builder: results.storage_capacities_by_tech, unit: GWh}
      - {id: ccs_capacities,             title: CCS capacities (fuel input),        builder: results.ccs_capacities,            unit: GW}
      # Utilisation of the fleet plotted above: energy through the port
      # p_nom is rated at, over p_nom_opt x the hours of the year.  Storage
      # is the same ratio against e_nom_opt, which makes it a cycle count.
      - {id: capacity_factors,           title: Capacity factors,                   builder: results.capacity_factors,           unit: "%"}
      - {id: capacity_factors_by_tech,   title: Capacity factors by technology,     builder: results.capacity_factors_by_tech,   unit: "%"}
      - {id: storage_cycles,             title: Storage cycles,                     builder: results.storage_cycles,             unit: cycles/year}
      - {id: storage_cycles_by_tech,     title: Storage cycles by technology,       builder: results.storage_cycles_by_tech,     unit: cycles/year}

  - id: dispatch
    title: Dispatch
    sections:
      - {id: power_dispatch_winter,  title: Power dispatch (winter week),    builder: dispatch.power_winter, unit: GW}
      - {id: power_dispatch_summer,  title: Power dispatch (summer week),    builder: dispatch.power_summer, unit: GW}
      - {id: heat_dispatch_winter,   title: Heat dispatch (winter week),     builder: dispatch.heat_winter,  unit: GW}
      - {id: heat_dispatch_summer,   title: Heat dispatch (summer week),     builder: dispatch.heat_summer,  unit: GW}
      # Electric vehicles: natural (uncontrolled) vs smart charging, V2G and
      # the fleet state of charge.  Absent from a model without EVs, in which
      # case the builder returns None and the section is simply not rendered.
      - {id: ev_charging_winter,     title: EV charging (winter week),        builder: ev.charging_winter,    unit: GW}
      - {id: ev_charging_summer,     title: EV charging (summer week),        builder: ev.charging_summer,    unit: GW}
      - {id: ev_energy_by_mode,      title: EV charging energy by mode,       builder: ev.energy_by_mode,     unit: TWh/year}

  - id: maps
    title: Maps
    # Maps do not depend on the selected node -- see output.shared_maps.
    shared: true
    sections:
      - {id: map_costs,              title: System cost map,                 builder: maps.costs}
      - {id: map_hydrogen,           title: Hydrogen network,                builder: maps.hydrogen}
      - {id: map_gas,                title: Gas network,                     builder: maps.gas}
